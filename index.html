<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>deceased</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700&family=Inter:wght@200;300&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Background canvases */
        #dust-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        #fog-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Graveyard silhouettes layer */
        .graveyard-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 40vh;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        /* Atmosphere overlays */
        .ground-haze {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 45vh;
            z-index: 4;
            pointer-events: none;
            background: linear-gradient(to top, rgba(3,3,3,0.95) 0%, rgba(3,3,3,0.5) 50%, transparent 100%);
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 45%, transparent 0%, transparent 30%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0.95) 100%);
        }

        .grain {
            position: fixed;
            inset: 0;
            z-index: 6;
            pointer-events: none;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 250px 250px;
        }

        .cracks {
            position: fixed;
            inset: 0;
            z-index: 7;
            pointer-events: none;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60,30 L75,60 L65,90 L90,110 L70,140 L85,180 L60,200' stroke='%23999' fill='none' stroke-width='0.5'/%3E%3Cpath d='M280,40 L265,70 L285,100 L270,140 L290,180 L275,220 L295,260' stroke='%23999' fill='none' stroke-width='0.5'/%3E%3Cpath d='M160,300 L175,270 L165,240 L185,210 L170,180' stroke='%23999' fill='none' stroke-width='0.5'/%3E%3Cpath d='M340,320 L355,290 L345,260 L365,230' stroke='%23999' fill='none' stroke-width='0.5'/%3E%3C/svg%3E");
        }

        /* ===== MAIN CONTENT WITH MARGINS & PADDING ===== */
        .content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            user-select: none;
            
            /* KEY FIX: Padding keeps text away from viewport edges */
            padding: 8vw;
        }

        h1 {
            font-family: 'Cinzel Decorative', 'Cinzel', serif;
            font-size: clamp(2.8rem, 11vw, 9rem);
            font-weight: 700;
            color: #b8b8b8;
            letter-spacing: 0.2em;
            text-transform: lowercase;
            text-align: center;
            line-height: 1.2;
            
            /* Margin gives space above/below the word itself */
            margin: 2rem 0;
            
            text-shadow:
                0 0 20px rgba(255,255,255,0.03),
                0 0 50px rgba(255,255,255,0.02),
                0 15px 40px rgba(0,0,0,0.9),
                0 30px 70px rgba(0,0,0,0.8);
            animation: tombstoneBreath 8s ease-in-out infinite;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: -1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(140,140,140,0.25), transparent);
        }

        .cross {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.4rem, 3vw, 2rem);
            color: #444;
            margin-top: 3rem;
            letter-spacing: 0.2em;
            opacity: 0;
            animation: fadeIn 5s ease-out 2s forwards;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }

        .epitaph {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.65rem, 1.4vw, 0.85rem);
            color: #4a4a4a;
            margin-top: 2.5rem;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 6s ease-out 3.5s forwards;
            font-weight: 200;
            text-align: center;
            line-height: 1.6;
            
            /* Padding so epitaph doesn't touch screen sides on mobile */
            padding: 0 1rem;
        }

        /* Animations */
        @keyframes tombstoneBreath {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
            50% {
                opacity: 0.85;
                transform: scale(1.01) translateY(-3px);
                filter: blur(0.2px);
            }
        }

        @keyframes fadeIn {
            to { opacity: 0.45; }
        }
    </style>
</head>
<body>
    <canvas id="dust-canvas"></canvas>
    <canvas id="fog-canvas"></canvas>
    
    <div class="graveyard-bg" id="graveyard"></div>
    
    <div class="ground-haze"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
    <div class="cracks"></div>

    <div class="content">
        <h1>deceased!</h1>
        <div class="cross">⋆˚࿔𓉸⋆˚࿔</div>
        <div class="epitaph">here lies what once was</div>
    </div>

    <script>
        /* ========== DUST SYSTEM ========== */
        const dustCanvas = document.getElementById('dust-canvas');
        const dustCtx = dustCanvas.getContext('2d');
        let W, H;
        let dustParticles = [];

        function resizeDust() {
            W = dustCanvas.width = window.innerWidth;
            H = dustCanvas.height = window.innerHeight;
        }

        class Dust {
            constructor() {
                this.reset(true);
            }

            reset(randomY = false) {
                this.x = Math.random() * W;
                this.y = randomY ? Math.random() * H : H + Math.random() * 30;
                this.size = Math.random() * 2.5 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = -(Math.random() * 0.45 + 0.1);
                this.opacity = Math.random() * 0.3 + 0.04;
                this.life = Math.random() * 350 + 200;
                this.maxLife = this.life;
                this.wobble = Math.random() * 0.012;
                this.wobbleOffset = Math.random() * Math.PI * 2;
            }

            update() {
                this.x += this.speedX + Math.sin(this.life * this.wobble + this.wobbleOffset) * 0.3;
                this.y += this.speedY;
                this.life--;

                if (this.life <= 0 || this.y < -20) {
                    this.reset();
                }
            }

            draw() {
                const alpha = (this.life / this.maxLife) * this.opacity;
                dustCtx.fillStyle = `rgba(150, 150, 150, ${alpha})`;
                dustCtx.beginPath();
                dustCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                dustCtx.fill();
            }
        }

        /* ========== FOG SYSTEM ========== */
        const fogCanvas = document.getElementById('fog-canvas');
        const fogCtx = fogCanvas.getContext('2d');
        let fogParticles = [];

        function resizeFog() {
            fogCanvas.width = window.innerWidth;
            fogCanvas.height = window.innerHeight;
        }

        class Fog {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.radius = Math.random() * 180 + 100;
                this.speedX = (Math.random() - 0.5) * 0.12;
                this.speedY = (Math.random() - 0.5) * 0.06;
                this.opacity = Math.random() * 0.025 + 0.008;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < -250) this.x = window.innerWidth + 250;
                if (this.x > window.innerWidth + 250) this.x = -250;
                if (this.y < -250) this.y = window.innerHeight + 250;
                if (this.y > window.innerHeight + 250) this.y = -250;
            }

            draw() {
                const g = fogCtx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                g.addColorStop(0, `rgba(70, 70, 70, ${this.opacity})`);
                g.addColorStop(1, 'rgba(70, 70, 70, 0)');
                fogCtx.fillStyle = g;
                fogCtx.beginPath();
                fogCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                fogCtx.fill();
            }
        }

        /* ========== GRAVEYARD SILHOUETTES ========== */
        function createGraveyard() {
            const container = document.getElementById('graveyard');
            container.innerHTML = '';
            const count = Math.floor(window.innerWidth / 160);
            
            for (let i = 0; i < count; i++) {
                const stone = document.createElement('div');
                const height = 50 + Math.random() * 90;
                const width = 22 + Math.random() * 35;
                const left = (i / count) * 100 + (Math.random() * 10 - 5);
                const tilt = (Math.random() - 0.5) * 10;
                const opacity = 0.04 + Math.random() * 0.05;
                
                stone.style.cssText = `
                    position: absolute;
                    bottom: 0;
                    left: ${left}%;
                    width: ${width}px;
                    height: ${height}px;
                    background: linear-gradient(to top, #0a0a0a, #151515);
                    opacity: ${opacity};
                    transform: rotate(${tilt}deg) translateY(25px);
                    border-radius: 50% 50% 0 0;
                    box-shadow: 0 0 25px rgba(0,0,0,0.6);
                    pointer-events: none;
                `;
                
                if (Math.random() > 0.65) {
                    stone.style.borderRadius = '0';
                    stone.style.clipPath = 'polygon(40% 0, 60% 0, 60% 35%, 100% 35%, 100% 55%, 60% 55%, 60% 100%, 40% 100%, 40% 55%, 0 55%, 0 35%, 40% 35%)';
                }
                
                container.appendChild(stone);
            }
        }

        /* ========== INIT & LOOP ========== */
        function init() {
            resizeDust();
            resizeFog();
            
            dustParticles = [];
            const dustCount = Math.floor((W * H) / 7000);
            for (let i = 0; i < dustCount; i++) {
                dustParticles.push(new Dust());
            }

            fogParticles = [];
            for (let i = 0; i < 12; i++) {
                fogParticles.push(new Fog());
            }

            createGraveyard();
        }

        function animate() {
            dustCtx.fillStyle = '#040404';
            dustCtx.fillRect(0, 0, W, H);

            dustParticles.forEach(p => {
                p.update();
                p.draw();
            });

            fogCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
            fogParticles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resizeDust();
            resizeFog();
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
